name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a rolling "chore(main): release X.Y.Z" PR built from conventional
  # commits. Merging it bumps pyproject.toml, writes CHANGELOG.md, and pushes
  # the vX.Y.Z tag — which docker.yml picks up to publish the semver image.
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # Manifest mode: .release-please-manifest.json pins the current
          # version (0.1.0, matching the existing v0.1.0 tag) so the first
          # run continues the series instead of restarting it.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT, not GITHUB_TOKEN: token-created events do not trigger other
          # workflows, so with GITHUB_TOKEN the release PR would never get its
          # required 'test' check and the tag would never start a docker build.
          token: ${{ secrets.RELEASE_TOKEN }}
