name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history to read tags
          token: ${{ secrets.RELEASE_TOKEN }}

      # Reads conventional commits since the last tag, bumps the version in
      # pyproject.toml (the single source of truth), writes CHANGELOG.md,
      # commits, tags vX.Y.Z and publishes the GitHub release.
      #
      # RELEASE_TOKEN rather than GITHUB_TOKEN: token-created tags do not
      # trigger other workflows, so docker.yml would never build the image.
      - uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.RELEASE_TOKEN }}
