name: ci
on: [push, pull_request]

# Least privilege: ci only reads the repo. Nothing here needs write scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: healthex
          POSTGRES_PASSWORD: healthex
          POSTGRES_DB: healthex
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://healthex:healthex@localhost:5432/healthex
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run healthex db-init
      - run: uv run pytest --cov=healthex --cov-report=term-missing
      # build the image too: dep/base-image bumps must not break the shipped artifact
      - run: docker build -t healthex:ci .
      - run: docker run --rm healthex:ci healthex --help
