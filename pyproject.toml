[project]
name = "healthex"
version = "0.1.0"
description = "Export Google Health sleep data to PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.3",
]

[project.scripts]
healthex = "healthex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthex"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "healthex.models"
disallow_subclassing_any = false

[tool.semantic_release]
# pyproject.toml is the ONLY place the version is stored; the git tag and the
# image tag are both derived from it.
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): v{version}"
build_command = ""            # we ship a container image, not a wheel
tag_format = "v{version}"

# Stay on 0.x until 1.0.0 is a deliberate decision: without these, a plain
# fix: on 0.1.0 resolves to 1.0.0 rather than 0.1.1.
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
